<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="follow-title follow-desc">
  <title id="follow-title">面板自动跟随当前对话 Worktree 的工作原理</title>
  <desc id="follow-desc">对话 A 打开 ~/work/app，对话 B 打开 ~/work/app-feat；插件通过 workspace-change 与 git rev-parse --git-common-dir 识别共享同一 .git 的两个 Worktree，自动在右侧面板切换对应更改列表与提交图表。</desc>

  <rect width="1200" height="360" rx="20" fill="#0d1117"/>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="19.25" fill="none" stroke="#262c36" stroke-width="1.5"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="52" y="50" font-size="13.5" font-weight="600" letter-spacing="1" fill="#8b949e">Antigravity 对话</text>
    <text x="444" y="50" font-size="13.5" font-weight="600" letter-spacing="1" fill="#8b949e">共享同一个 Repository 的 Worktree</text>
    <text x="852" y="50" font-size="13.5" font-weight="600" letter-spacing="1" fill="#8b949e">Git Graph 辅助栏面板</text>

    <!-- Left column -->
    <rect x="52" y="76" width="292" height="96" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="76" cy="110" r="5" fill="#3794ff"/>
    <text x="92" y="116" font-size="19" font-weight="600" fill="#f0f6fc">对话 A</text>
    <text x="76" y="148" font-family="ui-monospace, 'Cascadia Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#8b949e">~/work/app</text>

    <rect x="52" y="216" width="292" height="96" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="76" cy="250" r="5" fill="#dc267f"/>
    <text x="92" y="256" font-size="19" font-weight="600" fill="#f0f6fc">对话 B</text>
    <text x="76" y="288" font-family="ui-monospace, 'Cascadia Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#8b949e">~/work/app-feat</text>

    <!-- Middle column -->
    <rect x="444" y="76" width="312" height="236" rx="14" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(464 96) scale(1.15)" fill="#79c0ff"><path d="M12.5 12C12.776 12 13 11.776 13 11.5V3C13 1.895 12.105 1 11 1H5C3.895 1 3 1.895 3 3V13C3 14.105 3.895 15 5 15V15.5C5 15.702 5.122 15.885 5.309 15.962C5.495 16.039 5.711 15.997 5.854 15.854L6.5 15.208L7.146 15.854C7.242 15.95 7.37 16 7.5 16C7.564 16 7.63 15.987 7.691 15.962C7.878 15.885 8 15.702 8 15.5V15H12.5C12.776 15 13 14.776 13 14.5C13 14.224 12.776 14 12.5 14H8V13.5C8 13.224 7.776 13 7.5 13H5.5C5.224 13 5 13.224 5 13.5V14C4.448 14 4 13.552 4 13V12H12.5ZM4 3C4 2.448 4.448 2 5 2H11C11.552 2 12 2.448 12 3V11H4V3Z"/></g>
    <text x="490" y="112" font-size="19" font-weight="700" fill="#f0f6fc">app</text>
    <text x="534" y="112" font-size="14.5" fill="#8b949e">共享对象库 (.git)</text>

    <rect x="464" y="136" width="272" height="68" rx="9" fill="#0d1117" stroke="#3794ff" stroke-opacity="0.45"/>
    <text x="506" y="164" font-size="17" font-weight="600" fill="#f0f6fc">main</text>
    <text x="506" y="188" font-family="ui-monospace, 'Cascadia Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#8b949e">~/work/app</text>

    <rect x="464" y="224" width="272" height="68" rx="9" fill="#0d1117" stroke="#dc267f" stroke-opacity="0.45"/>
    <text x="506" y="252" font-size="17" font-weight="600" fill="#f0f6fc">feat/graph-view</text>
    <text x="506" y="276" font-family="ui-monospace, 'Cascadia Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#8b949e">~/work/app-feat</text>

    <!-- Right column -->
    <rect x="852" y="76" width="296" height="96" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(872 99) scale(1.15)" fill="#3794ff"><path d="M14 5.5C14 4.121 12.879 3 11.5 3C10.121 3 9 4.121 9 5.5C9 6.682 9.826 7.669 10.93 7.928C10.744 8.546 10.177 9 9.5 9H6.5C5.935 9 5.419 9.195 5 9.512V4.949C6.14 4.717 7 3.707 7 2.5C7 1.121 5.879 0 4.5 0C3.121 0 2 1.121 2 2.5C2 3.708 2.86 4.717 4 4.949V11.05C2.86 11.282 2 12.292 2 13.499C2 14.878 3.121 15.999 4.5 15.999C5.879 15.999 7 14.878 7 13.499C7 12.317 6.174 11.33 5.07 11.071C5.256 10.453 5.823 9.999 6.5 9.999H9.5C10.723 9.999 11.74 9.115 11.954 7.953C13.116 7.738 14 6.723 14 5.5ZM3 2.5C3 1.673 3.673 1 4.5 1C5.327 1 6 1.673 6 2.5C6 3.327 5.327 4 4.5 4C3.673 4 3 3.327 3 2.5ZM6 13.5C6 14.327 5.327 15 4.5 15C3.673 15 3 14.327 3 13.5C3 12.673 3.673 12 4.5 12C5.327 12 6 12.673 6 13.5ZM11.5 7C10.673 7 10 6.327 10 5.5C10 4.673 10.673 4 11.5 4C12.327 4 13 4.673 13 5.5C13 6.327 12.327 7 11.5 7Z"/></g>
    <text x="898" y="116" font-size="19" font-weight="600" fill="#f0f6fc">面板 A</text>
    <text x="872" y="148" font-size="15" fill="#8b949e">main 的更改列表与提交图表</text>

    <rect x="852" y="216" width="296" height="96" rx="12" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(872 239) scale(1.15)" fill="#dc267f"><path d="M14 5.5C14 4.121 12.879 3 11.5 3C10.121 3 9 4.121 9 5.5C9 6.682 9.826 7.669 10.93 7.928C10.744 8.546 10.177 9 9.5 9H6.5C5.935 9 5.419 9.195 5 9.512V4.949C6.14 4.717 7 3.707 7 2.5C7 1.121 5.879 0 4.5 0C3.121 0 2 1.121 2 2.5C2 3.708 2.86 4.717 4 4.949V11.05C2.86 11.282 2 12.292 2 13.499C2 14.878 3.121 15.999 4.5 15.999C5.879 15.999 7 14.878 7 13.499C7 12.317 6.174 11.33 5.07 11.071C5.256 10.453 5.823 9.999 6.5 9.999H9.5C10.723 9.999 11.74 9.115 11.954 7.953C13.116 7.738 14 6.723 14 5.5ZM3 2.5C3 1.673 3.673 1 4.5 1C5.327 1 6 1.673 6 2.5C6 3.327 5.327 4 4.5 4C3.673 4 3 3.327 3 2.5ZM6 13.5C6 14.327 5.327 15 4.5 15C3.673 15 3 14.327 3 13.5C3 12.673 3.673 12 4.5 12C5.327 12 6 12.673 6 13.5ZM11.5 7C10.673 7 10 6.327 10 5.5C10 4.673 10.673 4 11.5 4C12.327 4 13 4.673 13 5.5C13 6.327 12.327 7 11.5 7Z"/></g>
    <text x="898" y="256" font-size="19" font-weight="600" fill="#f0f6fc">面板 B</text>
    <text x="872" y="288" font-size="15" fill="#8b949e">feat/graph-view 的更改与图表</text>

    <!-- Lanes -->
    <g fill="none" stroke-width="2.6" stroke-linecap="round">
      <path d="M 344 124 H 378 A 14 14 0 0 1 392 138 V 156 A 14 14 0 0 0 406 170 H 484" stroke="#3794ff"/>
      <path d="M 344 264 H 484" stroke="#dc267f"/>
      <path d="M 736 170 H 790 A 14 14 0 0 0 804 156 V 138 A 14 14 0 0 1 818 124 H 852" stroke="#3794ff"/>
      <path d="M 736 264 H 852" stroke="#dc267f"/>
    </g>

    <!-- Nodes -->
    <g stroke="#0d1117" stroke-width="3">
      <circle cx="484" cy="170" r="7.5" fill="#3794ff"/>
      <circle cx="484" cy="264" r="7.5" fill="#dc267f"/>
    </g>

    <!-- Subtle bottom protocol labels -->
    <text x="394" y="336" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#6e7681">workspace-change</text>
    <text x="804" y="336" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#6e7681">fs.watch 自动同步</text>
  </g>
</svg>