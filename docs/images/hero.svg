<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Git Graph：Antigravity 辅助栏里的源代码管理与提交图表</title>
  <desc id="desc">左侧是插件名 Git Graph 与一句说明：当前对话在哪个 Worktree，面板就跟到哪个。右侧是用插件自身泳道布局算法画出的提交图表，包含 main、feat/graph-view、docs/install 与 origin/main 四个引用。</desc>

