<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Git Graph</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/preload.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <main id="app" class="gw-pane" data-testid="app-pane">
    <!-- 存储库：常驻列出当前 Workspace 命中的全部仓库，点击行切换（对齐 VS Code「存储库」视图） -->
    <section
      id="section-repos"
      class="gw-section gw-section-repos hidden"
      data-testid="section-repos"
      aria-labelledby="repos-section-title"
    >
      <div class="gw-section-header" data-testid="repos-section-header">
        <button
          id="repos-collapse-btn"
          type="button"
          class="gw-section-toggle gw-clip-focus"
          data-testid="repos-collapse-btn"
          aria-expanded="true"
          aria-controls="section-repos-body"
        >
          <span id="repos-collapse-chevron" class="gw-chevron" aria-hidden="true"></span>
          <span id="repos-section-title" class="gw-section-title"></span>
        </button>
      </div>
      <div
        id="section-repos-body"
        class="gw-section-body gw-repos-body"
        data-testid="section-repos-body"
        role="listbox"
      ></div>
    </section>

    <!-- 全局状态横幅（如文件监听风暴降级告警） -->
    <div id="global-banners" class="gw-banner-stack hidden" data-testid="global-banners"></div>

    <!-- 首屏加载态：避免脚本初始化与首次快照返回前出现空白面板 -->
    <section id="loading-state" class="gw-loading-state" data-testid="loading-state" aria-live="polite" aria-busy="true">
      <div class="gw-loading-spinner" aria-hidden="true"></div>
      <p id="loading-state-text" class="gw-loading-text">正在加载 Git 仓库…</p>
    </section>

    <!-- 零仓库空态 -->
    <section id="empty-state" class="gw-empty-state hidden" data-testid="empty-state" aria-live="polite">
      <div id="empty-state-icon" class="gw-empty-icon" aria-hidden="true"></div>
      <h2 id="empty-state-title" class="gw-empty-title"></h2>
      <p id="empty-state-desc" class="gw-empty-desc"></p>
    </section>

    <!-- VS Code 风格上下可拖拽双区 -->
    <div id="dual-pane" class="gw-dual-pane hidden" data-testid="dual-pane">
      <!-- 上区：源代码管理 -->
      <section
        id="section-changes"
        class="gw-section gw-section-changes"
        data-testid="section-changes"
        aria-labelledby="changes-section-title"
      >
        <div class="gw-section-header" data-testid="changes-section-header">
          <button
            id="changes-collapse-btn"
            type="button"
            class="gw-section-toggle gw-clip-focus"
            data-testid="changes-collapse-btn"
            aria-expanded="true"
            aria-controls="section-changes-body"
          >
            <span id="changes-collapse-chevron" class="gw-chevron" aria-hidden="true"></span>
            <span id="changes-section-title" class="gw-section-title"></span>
          </button>
        </div>
        <div
          id="section-changes-body"
          class="gw-section-body gw-changes-body"
          data-testid="section-changes-body"
        ></div>
      </section>

      <!-- 4px 中缝拖拽分隔条 -->
      <div
        id="pane-sash"
        class="gw-sash"
        data-testid="pane-sash"
        role="separator"
        aria-orientation="horizontal"
        aria-valuemin="15"
        aria-valuemax="85"
        aria-valuenow="42"
        tabindex="0"
      ></div>

      <!-- 下区：提交图表 -->
      <section
        id="section-graph"
        class="gw-section gw-section-graph"
        data-testid="section-graph"
        aria-labelledby="graph-section-title"
      >
        <div id="graph-section-header" class="gw-section-header gw-graph-toolbar" data-testid="graph-section-header">
          <button
            id="graph-collapse-btn"
            type="button"
            class="gw-section-toggle gw-clip-focus"
            data-testid="graph-collapse-btn"
            aria-expanded="true"
            aria-controls="section-graph-body"
          >
            <span id="graph-collapse-chevron" class="gw-chevron" aria-hidden="true"></span>
            <span id="graph-section-title" class="gw-section-title"></span>
          </button>
          <div id="graph-toolbar-actions" class="gw-toolbar-actions" data-testid="graph-toolbar-actions"></div>
        </div>
        <div id="graph-search-bar" class="gw-search-bar hidden" data-testid="graph-search-bar"></div>
        <div
          id="section-graph-body"
          class="gw-section-body gw-graph-body"
          data-testid="section-graph-body"
          tabindex="0"
        ></div>
      </section>
    </div>
  </main>

  <!-- 浮层置于 container-type 容器外，保证 position: fixed 严格相对于 iframe 视口定位 -->
  <div id="graph-more-menu" class="gw-dropdown-menu hidden" data-testid="graph-more-menu" role="menu"></div>

  <aside
    id="commit-popover"
    class="gw-popover hidden"
    data-testid="commit-popover"
    role="dialog"
    aria-modal="false"
  ></aside>

  <div
    id="modal-overlay"
    class="gw-modal-overlay hidden"
    data-testid="modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >
    <div id="modal-dialog" class="gw-modal" data-testid="modal-dialog"></div>
  </div>

  <!-- 轻提示挂载层：toast.js 在其中为每个触发控件创建固定定位的提示栈 -->
  <div
    id="toast-container"
    data-testid="toast-container"
    aria-live="polite"
    aria-atomic="false"
  ></div>
</body>
</html>
